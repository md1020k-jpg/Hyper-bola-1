name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Hyperbolic Explorer v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Package & Prepare Release APKs
        run: |
          mkdir -p release_apks
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_apks/app-release.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_apks/hyperbolic-explorer-release.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_apks/app-debug.apk
          fi
          echo "Listing packaged release artifacts:"
          ls -la release_apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperbolic-explorer-apk
          path: release_apks/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release for Tag or Dispatch
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          name: ${{ inputs.release_title || (startsWith(github.ref, 'refs/tags/v') && format('Hyperbolic Explorer {0}', github.ref_name)) || 'Hyperbolic Explorer v1.0.0' }}
          body: |
            ## Hyperbolic Explorer Release
            
            Interactive Android visualization and mathematical analysis of hyperbolic functions:
            - **Functions Supported**: $\cosh(x)$, $\sinh(x)$, $\tanh(x)$, $\operatorname{sech}(x)$, $\operatorname{csch}(x)$, $\operatorname{coth}(x)$
            - **Calculus Tools**: Real-time crosshair inspection, first derivative slope ($\frac{dy}{dx}$), and dynamic tangent line
            - **Geometric Comparisons**: Hyperbolic vs Parabola transformation with smooth morphing
            - **Formulas & Verification**: Live fundamental identity verification $\cosh^2(u) - \sinh^2(u) = 1$
            
            ### Downloads
            - **`app-release.apk`**: Ready to install on Android devices (Android 7.0+ / API 24+)
            - **`hyperbolic-explorer-release.apk`**: Standalone named package
          prerelease: false
          draft: false
          files: |
            release_apks/app-release.apk
            release_apks/hyperbolic-explorer-release.apk
            release_apks/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

